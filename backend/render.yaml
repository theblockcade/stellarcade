# Render Blueprint — backend API (free tier).
#
# Shared Postgres Instance: Render free tier allows 1 free database per account.
# We point DATABASE_URL at the existing Postgres database (stellarcade-arbiter-db).
# Knex migrations create backend-specific tables (users, leaderboard, transactions, etc.)
# without conflicting with arbiter tables.

services:
  - type: web
    name: stellarcade-backend
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "3000"
      - key: STELLAR_NETWORK
        value: "testnet"
      - key: HORIZON_URL
        value: "https://horizon-testnet.stellar.org"
      - key: NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VAULT_ADDRESS
        sync: false
      - key: REDIS_URL
        sync: false
